name: VPS Deployment

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  # Replace with your Docker Hub username
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_NAME: lofiapps
  # Set environment based on branch
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Create Firebase Service Account File (for build)
      # Decode the base64 secret into the resources directory so it gets packaged in the JAR
      run: |
        echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 -d > src/main/resources/firebase-service-account.json

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.ENVIRONMENT }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Prepare VPS directory
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
        script: |
          mkdir -p apps/${{ env.IMAGE_NAME }}/${{ env.ENVIRONMENT }}
          # Attempt to fix permissions if we have sudo access (ignore failure)
          sudo chown -R $USER:$USER apps/${{ env.IMAGE_NAME }}/${{ env.ENVIRONMENT }} || true

    # Copy docker-compose.vps.yml to the VPS
    - name: Copy docker-compose file to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
        # Copy docker-compose AND nginx configuration folder
        source: "docker-compose.vps.yml,nginx"
        target: "apps/${{ env.IMAGE_NAME }}/${{ env.ENVIRONMENT }}"
        debug: true
        timeout: 30s

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
        debug: true
        timeout: 30s
        script: |
          # Define variables
          export ENVIRONMENT=${{ env.ENVIRONMENT }}
          export VERSION=${{ github.sha }}
          export DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          
          # Set specific ports for environments to avoid conflicts
          if [ "$ENVIRONMENT" = "production" ]; then
            export APP_PORT=8080
            export DB_PORT_HOST=1433
            export REDIS_PORT_HOST=6379
          else
            export APP_PORT=8081
            export DB_PORT_HOST=1434
            export REDIS_PORT_HOST=6380
          fi
          
          # Setup directory in USER HOME (no sudo needed)
          # We use relative path 'apps/...' which means '~/apps/...'
          DEPLOY_DIR="apps/${{ env.IMAGE_NAME }}/${{ env.ENVIRONMENT }}"
          mkdir -p $DEPLOY_DIR
          cd $DEPLOY_DIR
          
          # Create .env file with all secrets
          cat <<EOF > .env.${ENVIRONMENT}
          ENVIRONMENT=${ENVIRONMENT}
          VERSION=${VERSION}
          DOCKER_IMAGE=${DOCKER_IMAGE}
          APP_PORT=${APP_PORT}
          DB_PORT_HOST=${DB_PORT_HOST}
          REDIS_PORT_HOST=${REDIS_PORT_HOST}
          
          # Database
          DB_HOST=sqlserver
          DB_PORT=1433
          DB_NAME=lofidb
          DB_USERNAME=sa
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          
          # JWT
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS=86400000
          JWT_REFRESH_EXPIRATION_MS=604800000
          
          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          
          # Cloudflare R2
          CLOUDFLARE_R2_ACCESS_KEY_ID=${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY=${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT=${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET_NAME=${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          
          # Mail
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_SMTP_AUTH=true
          MAIL_SMTP_STARTTLS=true
          
          # Firebase
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          
          # Google Auth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          
          # URLs
          APP_BASE_URL=${{ secrets.APP_BASE_URL }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF
          
          # Check if docker-compose.vps.yml exists (copied via scp)
          if [ ! -f docker-compose.vps.yml ]; then
            echo "Error: docker-compose.vps.yml not found!"
            exit 1
          fi
          
          # Pull latest Docker image
          docker pull ${DOCKER_IMAGE}:${VERSION}
          
          # Stop ONLY the specific containers for this environment using the env file
          docker-compose -f docker-compose.vps.yml --env-file .env.${ENVIRONMENT} down --remove-orphans || true
          
          # Start new containers
          docker-compose -f docker-compose.vps.yml --env-file .env.${ENVIRONMENT} up -d
          
          # Prune old images
          docker image prune -f
          
          echo "Deployment to ${ENVIRONMENT} completed!"

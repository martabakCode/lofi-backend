---
version: "3.8"
services:
  app:
    image: "${DOCKER_IMAGE:-lofiapps}:${VERSION:-latest}"
    container_name: "lofiapps-api-${ENVIRONMENT}"
    ports:
    - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${ENVIRONMENT}"
      SERVER_PORT: "8080"
      DB_HOST: "sqlserver"
      DB_PORT: "1433"
      DB_NAME: "${DB_NAME:-lofidb}"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION_MS: "${JWT_EXPIRATION_MS:-86400000}"
      JWT_REFRESH_EXPIRATION_MS: "${JWT_REFRESH_EXPIRATION_MS:-604800000}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-true}"
      MAIL_SMTP_STARTTLS: "${MAIL_SMTP_STARTTLS:-true}"
      CLOUDFLARE_R2_ACCESS_KEY_ID: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
      CLOUDFLARE_R2_ENDPOINT: "${CLOUDFLARE_R2_ENDPOINT}"
      CLOUDFLARE_R2_BUCKET_NAME: "${CLOUDFLARE_R2_BUCKET_NAME}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY}"
      FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      APP_BASE_URL: "${APP_BASE_URL}"
      FRONTEND_URL: "${FRONTEND_URL}"
      LOGGING_LEVEL_ROOT: "${LOGGING_LEVEL:-INFO}"
      LOGGING_LEVEL_COM_LOFI: "${LOGGING_LEVEL_APP:-INFO}"
    depends_on:
      redis:
        condition: "service_healthy"
      sqlserver:
        condition: "service_healthy"
    restart: "unless-stopped"
    networks:
    - "lofi-network"
    healthcheck:
      test:
      - "CMD"
      - "curl"
      - "-f"
      - "http://localhost:8080/actuator/health"
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "60s"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "1G"
  redis:
    image: "redis:7-alpine"
    container_name: "lofi-redis-${ENVIRONMENT}"
    ports:
    - "${REDIS_PORT_HOST:-6379}:6379"
    command: "redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru\
      \ --requirepass \"${REDIS_PASSWORD}\""
    volumes:
    - "redis_data:/data"
    restart: "unless-stopped"
    networks:
    - "lofi-network"
    healthcheck:
      test:
      - "CMD"
      - "redis-cli"
      - "-a"
      - "${REDIS_PASSWORD}"
      - "ping"
      interval: "10s"
      timeout: "3s"
      retries: 3
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    platform: "linux/amd64"
    container_name: "lofi-sqlserver-${ENVIRONMENT}"
    ports:
    - "${DB_PORT_HOST:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    volumes:
    - "sqlserver_data:/var/opt/mssql"
    restart: "unless-stopped"
    networks:
    - "lofi-network"
    healthcheck:
      test:
      - "CMD-SHELL"
      - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q\
        \ 'SELECT 1' || exit 1"
      interval: "10s"
      timeout: "3s"
      retries: 10
      start_period: "30s"
  nginx:
    image: "nginx:alpine"
    container_name: "lofi-nginx-${ENVIRONMENT}"
    ports:
    - "${NGINX_HTTP_PORT:-80}:80"
    - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
    - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    - "./nginx/conf.d:/etc/nginx/conf.d:ro"
    - "./nginx/ssl:/etc/nginx/ssl:ro"
    - "nginx_logs:/var/log/nginx"
    depends_on:
    - "app"
    restart: "unless-stopped"
    networks:
    - "lofi-network"
volumes:
  redis_data: null
  sqlserver_data: null
  nginx_logs: null
networks:
  lofi-network:
    driver: "bridge"
